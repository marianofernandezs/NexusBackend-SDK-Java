# Configuración de Tests - nexus-test.properties
# Este archivo contiene configuraciones para ejecutar los tests

# Configuración del servidor de prueba
nexus.test.base.url=https://localhost:3000/api/
nexus.test.api.key=test-api-key-12345

# Configuración de timeouts para tests
nexus.test.connection.timeout=10000
nexus.test.read.timeout=15000

# Configuración de reintentos
nexus.test.retry.attempts=3
nexus.test.retry.delay=1000

# Credenciales de prueba
nexus.test.user.email=test@example.com
nexus.test.user.password=TestPassword123!
nexus.test.user.name=Test User

# Configuración de logging para tests
nexus.test.logging.enabled=true
nexus.test.logging.level=DEBUG

# Configuración para tests de integración
nexus.test.integration.enabled=true
nexus.test.integration.cleanup=true

# Configuración para WireMock (si se usa)
nexus.test.wiremock.enabled=true
nexus.test.wiremock.port=8089

# Base de datos para tests (si aplica)
nexus.test.db.url=jdbc:h2:mem:testdb
nexus.test.db.username=sa
nexus.test.db.password=

# Configuración de seguridad para tests
nexus.test.ssl.validation.disabled=true
nexus.test.allow.insecure.connections=true